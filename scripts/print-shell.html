<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{DOCUMENT TITLE}}</title>
<style>
  /* ==========================================================
     Print shell — deliberately plain.

     Single column, standard fonts, no tables, no graphics.
     Everything here is inline so the file works forever with
     no network and no dependencies. See docs/ats-notes.md for
     why it looks like this.

     Adjust --base-size and --line-height first if a document
     is slightly over or under a page. Don't go below 10pt.
     ========================================================== */

  :root {
    --ink: #111;
    --ink-soft: #444;
    --rule: #333;
    --base-size: 10.5pt;
    --line-height: 1.35;

    /* Page geometry. The vertical margin is its own variable because the
       screen page ruler below is derived from it — a printed page is 11in
       tall, but it only holds (11in - top - bottom) of actual content.
       Change --page-margin-v and the ruler stays correct. */
    --page-margin-v: 0.6in;
    --page-margin-h: 0.7in;
    --page-margin: var(--page-margin-v) var(--page-margin-h);
    --content-per-page: calc(11in - (var(--page-margin-v) * 2));
  }

  @page {
    size: letter;
    margin: var(--page-margin);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #f0f0f0;
  }

  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: var(--base-size);
    line-height: var(--line-height);
    color: var(--ink);
  }

  .page {
    max-width: 8.5in;
    margin: 0.4in auto;
    padding: var(--page-margin);
    background: #fff;
    box-shadow: 0 0 0.12in rgba(0,0,0,0.18);

    /* Screen-only page ruler — see the note below.
       Measured from the CONTENT box, not the padding box, and repeating
       every --content-per-page. Both of those matter; see below. */
    background-origin: content-box;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--content-per-page) - 1px),
      rgba(190, 60, 60, 0.4) calc(var(--content-per-page) - 1px),
      rgba(190, 60, 60, 0.4) var(--content-per-page)
    );
  }

  /* ----------------------------------------------------------
     The page ruler, on screen only.

     A faint line marks where the paper would break, so you can see
     a document going long without printing anything. Content
     crossing the first line means two pages; crossing the second
     means three, which is usually a surprise and always worth
     knowing before you hit print.

     Two things here are easy to get wrong, and getting either one
     wrong makes the ruler worse than useless — it reports one page
     while you are already onto the second:

     1. The interval is NOT 11in. A sheet is 11in tall, but @page
        takes --page-margin-v off the top and bottom, so one page
        only carries (11in - 2 × margin) of content. That is what
        --content-per-page computes.

     2. The origin is the CONTENT box, not the padding box. The
        default (padding-box) would start the first line a full
        margin above where the text actually begins, shifting every
        line down the page.

     It is still a guide, not an oracle — real breaks depend on the
     browser, the fonts, and the paper size, and a block with
     break-inside: avoid gets pushed whole rather than split. Use it
     to catch a regression early; use your own print preview to
     decide anything.

     `@media print` removes it, so it can never reach a PDF.
     ---------------------------------------------------------- */

  @media print {
    html, body { background: #fff; }   /* html too — it paints the canvas */
    .page {
      margin: 0;
      padding: 0;
      max-width: none;
      box-shadow: none;
      background-image: none;          /* no rulers on paper, ever */
    }
    .no-print { display: none !important; }
  }

  /* ---------- Name and contact ---------- */

  h1 {
    font-size: 19pt;
    font-weight: bold;
    letter-spacing: 0.01em;
    margin: 0 0 0.10in;
    line-height: 1.1;
  }

  /* Contact details live in the body, never in a page header —
     headers are frequently skipped by parsers. */
  .contact {
    font-size: 10pt;
    color: var(--ink-soft);
    margin: 0 0 0.22in;
  }

  /* ---------- Sections ---------- */

  h2 {
    font-size: 11.5pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin: 0.20in 0 0.08in;
    padding-bottom: 0.03in;
    border-bottom: 1px solid var(--rule);
    break-after: avoid;
    page-break-after: avoid;
  }

  h2:first-of-type { margin-top: 0.05in; }

  /* ---------- Roles ---------- */

  h3 {
    font-size: var(--base-size);
    font-weight: bold;
    margin: 0.14in 0 0.01in;
    break-after: avoid;
    page-break-after: avoid;
  }

  /* The date/location line. Its own line, consistent format,
     so a parser can reconstruct the work history. */
  h3 + p {
    font-size: 9.5pt;
    color: var(--ink-soft);
    margin: 0 0 0.05in;
  }

  p { margin: 0 0 0.07in; }

  ul {
    margin: 0.04in 0 0.10in;
    padding-left: 0.22in;
  }

  li {
    margin-bottom: 0.045in;
    padding-left: 0.02in;
  }

  /* Keep a role's heading, dates, and bullets together where
     the page break allows it. */
  .role { break-inside: avoid-page; }

  strong { font-weight: bold; }
  em { font-style: italic; }

  a { color: inherit; text-decoration: none; }

  /* ---------- Cover letters ---------- */

  .letter p { margin: 0 0 0.14in; text-align: left; }
  .letter .meta { margin-bottom: 0.24in; }

  /* ---------- Screen-only print button ---------- */

  .no-print {
    max-width: 8.5in;
    margin: 0.3in auto 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 11px;
    color: #555;
    text-align: center;
  }
  .no-print button {
    font: inherit;
    padding: 6px 14px;
    border: 1px solid #999;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="page">
<!-- CONTENT START -->

  {{DOCUMENT CONTENT — replace this whole block}}

<!-- CONTENT END -->
</div>

<div class="no-print">
  <button onclick="window.print()">Save as PDF</button>
  <p>In the print dialog: margins <strong>Default</strong>, headers and footers <strong>off</strong>.</p>
</div>

</body>
</html>
