<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{DOCUMENT TITLE}}</title>
<style>
  /* ==========================================================
     Print shell — deliberately plain.

     Single column, standard fonts, no tables, no graphics.
     Everything here is inline so the file works forever with
     no network and no dependencies. See docs/ats-notes.md for
     why it looks like this.

     Adjust --base-size and --line-height first if a document
     is slightly over or under a page. Don't go below 10pt.
     ========================================================== */

  :root {
    --ink: #111;
    --ink-soft: #444;
    --rule: #333;
    --base-size: 10.5pt;
    --line-height: 1.35;
    --page-margin: 0.6in 0.7in;
  }

  @page {
    size: letter;
    margin: var(--page-margin);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #f0f0f0;
  }

  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: var(--base-size);
    line-height: var(--line-height);
    color: var(--ink);
  }

  .page {
    max-width: 8.5in;
    margin: 0.4in auto;
    padding: var(--page-margin);
    background: #fff;
    box-shadow: 0 0 0.12in rgba(0,0,0,0.18);
  }

  @media print {
    html, body { background: #fff; }   /* html too — it paints the canvas */
    .page {
      margin: 0;
      padding: 0;
      max-width: none;
      box-shadow: none;
    }
    .no-print { display: none !important; }
  }

  /* ---------- Name and contact ---------- */

  h1 {
    font-size: 19pt;
    font-weight: bold;
    letter-spacing: 0.01em;
    margin: 0 0 0.10in;
    line-height: 1.1;
  }

  /* Contact details live in the body, never in a page header —
     headers are frequently skipped by parsers. */
  .contact {
    font-size: 10pt;
    color: var(--ink-soft);
    margin: 0 0 0.22in;
  }

  /* ---------- Sections ---------- */

  h2 {
    font-size: 11.5pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin: 0.20in 0 0.08in;
    padding-bottom: 0.03in;
    border-bottom: 1px solid var(--rule);
    break-after: avoid;
    page-break-after: avoid;
  }

  h2:first-of-type { margin-top: 0.05in; }

  /* ---------- Roles ---------- */

  h3 {
    font-size: var(--base-size);
    font-weight: bold;
    margin: 0.14in 0 0.01in;
    break-after: avoid;
    page-break-after: avoid;
  }

  /* The date/location line. Its own line, consistent format,
     so a parser can reconstruct the work history. */
  h3 + p {
    font-size: 9.5pt;
    color: var(--ink-soft);
    margin: 0 0 0.05in;
  }

  p { margin: 0 0 0.07in; }

  ul {
    margin: 0.04in 0 0.10in;
    padding-left: 0.22in;
  }

  li {
    margin-bottom: 0.045in;
    padding-left: 0.02in;
  }

  /* Keep a role's heading, dates, and bullets together where
     the page break allows it. */
  .role { break-inside: avoid-page; }

  strong { font-weight: bold; }
  em { font-style: italic; }

  a { color: inherit; text-decoration: none; }

  /* ---------- Cover letters ---------- */

  .letter p { margin: 0 0 0.14in; text-align: left; }
  .letter .meta { margin-bottom: 0.24in; }

  /* ---------- Screen-only print button ---------- */

  .no-print {
    max-width: 8.5in;
    margin: 0.3in auto 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 11px;
    color: #555;
    text-align: center;
  }
  .no-print button {
    font: inherit;
    padding: 6px 14px;
    border: 1px solid #999;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="page">
<!-- CONTENT START -->

  {{DOCUMENT CONTENT — replace this whole block}}

<!-- CONTENT END -->
</div>

<div class="no-print">
  <button onclick="window.print()">Save as PDF</button>
  <p>In the print dialog: margins <strong>Default</strong>, headers and footers <strong>off</strong>.</p>
</div>

</body>
</html>
